<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f7;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
.game{position:relative;width:600px;height:150px;flex:none;transform-origin:center;outline:none}
.runner-container{height:150px;max-width:600px;overflow:hidden;position:relative;width:44px}
.runner-canvas{height:150px;max-width:600px;opacity:1;overflow:hidden;position:absolute;top:0;z-index:2;image-rendering:pixelated}
.controller{background:transparent;height:250%;left:0;position:absolute;top:0;width:100%;z-index:1}
.assets{display:none}
#help-btn{position:fixed;top:16px;right:16px;width:36px;height:36px;border:2px solid #535353;border-radius:50%;background:transparent;color:#535353;font:bold 18px/32px monospace;text-align:center;cursor:pointer;padding:0;opacity:.6;z-index:10}
#help-btn:hover,#help-btn[aria-expanded=true]{opacity:1}
#help{display:none;position:fixed;top:64px;right:16px;max-width:280px;padding:14px 18px;border:2px solid #535353;background:#f7f7f7;color:#535353;font:14px/1.7 monospace;z-index:10}
#help[data-open]{display:block}
#help kbd{display:inline-block;min-width:1.4em;padding:0 5px;border:1px solid #535353;border-radius:3px;text-align:center}
#help p{margin:0}
#hint{position:fixed;left:0;right:0;bottom:12%;text-align:center;color:#535353;font:15px/1.8 monospace;padding:0 16px;pointer-events:none;transition:opacity .3s}
#hint[hidden]{display:block;opacity:0}
#hint kbd{display:inline-block;min-width:1.4em;padding:0 6px;border:1px solid #535353;border-radius:3px;text-align:center}
@media (max-height:420px){#hint{bottom:8px}}
@media (prefers-color-scheme:dark){html,body{background:#202124}.game{filter:invert(1)}#help-btn,#help{border-color:#acacac;color:#acacac}#help{background:#202124}#help kbd{border-color:#acacac}#hint{color:#acacac}#hint kbd{border-color:#acacac}}
</style>
</head>

<div id="help" role="dialog" aria-label="Controls">

<p><kbd>&darr;</kbd> &mdash; duck</p>
<p><kbd>Enter</kbd> or tap &mdash; restart</p>
</div>

<script>
// scale the 600x150 game to fill the viewport, with generous margins on desktop;
// on narrow screens the game runs at 1:1 and adapts its width like Chrome on mobile does
(function(){var g=document.getElementById("game");function fit(){var pad=innerWidth>=768?Math.max(64,Math.round(innerWidth*.12)):12,w=innerWidth-pad*2,h=innerHeight-pad*2;if(w<600){g.style.width=w+"px";g.style.transform=""}else{g.style.width="600px";g.style.transform="scale("+Math.min(w/600,h/150)+")"}}addEventListener("resize",fit);fit()})();
addEventListener("keydown",function(e){if([32,38,40].indexOf(e.keyCode)>-1)e.preventDefault();if(e.keyCode==27)toggleHelp(false)});
var helpBtn=document.getElementById("help-btn"),help=document.getElementById("help");
function toggleHelp(open){if(open===undefined)open=!help.hasAttribute("data-open");open?help.setAttribute("data-open",""):help.removeAttribute("data-open");helpBtn.setAttribute("aria-expanded",open);helpBtn.blur()}
helpBtn.addEventListener("click",function(e){e.stopPropagation();toggleHelp()});
// what to press to start, shown until the first jump
var touch="ontouchstart" in window||navigator.maxTouchPoints>0,hint=document.getElementById("hint");
hint.innerHTML=touch?"Tap anywhere to start and jump":"Press <kbd>Space</kbd> or <kbd>&uarr;</kbd> to start and jump &middot; <kbd>&darr;</kbd> to duck";
function hideHint(){hint.hidden=true}
addEventListener("keydown",function(e){if(e.keyCode==32||e.keyCode==38)hideHint()});
addEventListener("touchstart",hideHint,{passive:true});
</script>
<script src="runner.js"></script>
<script>
// tap anywhere to jump / restart: the game only listens inside its own (scaled-down) box
(function(){var r=Runner.instance_;if(!r||!("ontouchstart" in window||navigator.maxTouchPoints>0))return;
if(r.touchController)r.touchController.remove();r.containerEl.removeEventListener("touchstart",r);
function inHelp(e){return help.contains(e.target)||helpBtn.contains(e.target)}
document.addEventListener("touchstart",function(e){if(inHelp(e))return;e.preventDefault();toggleHelp(false);if(r.crashed)r.restart();else r.onKeyDown({type:"touchstart",keyCode:0,preventDefault:function(){}})},{passive:false});
document.addEventListener("touchend",function(e){if(inHelp(e))return;e.preventDefault();r.onKeyUp({type:"touchend",keyCode:0})},{passive:false});
})();
</script>
